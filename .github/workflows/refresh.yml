# Daily: fetch public data with the built-in GITHUB_TOKEN, redraw every SVG, re-inject the README feed.
name: refresh-profile
on:
  schedule: [{ cron: "17 23 * * *" }]   # 06:17 Bangkok time (UTC+7)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "scripts/**"]
permissions:
  contents: write
concurrency: { group: profile-write, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch data (GraphQL, GITHUB_TOKEN only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py
      - name: Render SVGs and README
        working-directory: scripts
        run: |
          python render_hero.py
          python render_stack.py
          python render_poll.py
          python build_readme.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets data README.md
          git diff --cached --quiet || git commit -m "chore: daily profile refresh"
          git push
